[package]
name = "codex-desktop"
version = "0.1.0"
description = "A lightweight dual-display AI control center"
authors = ["AgentRoom"]
edition = "2021"

[patch.crates-io]
wry = { path = "../vendor/wry" }

[lib]
name = "codex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
wry = { path = "../vendor/wry" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }
windows-core = "0.62"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
calamine = "=0.37.0"
pdf-extract = "=0.12.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Networking", "Networking_Sockets", "Storage_Streams", "Security_Cryptography_Certificates"] }
base64 = "0.22"
webview2-com = "=0.39.1"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
  "Win32_System_Performance",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Time",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_WindowsAndMessaging",
] }
