name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths:
      - '.github/workflows/windows-build.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'vendor/**'
      - 'tests/**'
      - 'scripts/**'
      - 'licenses/**'
      - 'docs/licenses/**'
      - 'package*.json'
      - '*config*'
      - '*.html'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-pc-windows-msvc
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Prepare Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          $targetDirectory = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target'
          "CARGO_TARGET_DIR=$targetDirectory" >> $env:GITHUB_ENV
          $flags = @(
            ('--remap-path-prefix=' + $env:GITHUB_WORKSPACE + '=/gleamdesk'),
            ('--remap-path-prefix=' + $env:USERPROFILE + '=/developer')
          )
          "CARGO_ENCODED_RUSTFLAGS=$($flags -join [char]31)" >> $env:GITHUB_ENV
      - name: Install frontend dependencies
        run: npm.cmd ci
      - name: Run offline frontend tests
        run: npm.cmd test
      - name: Build Windows executable and NSIS installer
        run: npm.cmd run tauri -- build --bundles nsis -- --locked
      - name: Assemble unsigned packages
        run: ./scripts/package-windows.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'gleamdesk-packages')
      - name: Upload unsigned packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: GleamDesk-windows-x64-unsigned-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gleamdesk-packages/*.zip
            ${{ runner.temp }}/gleamdesk-packages/*-setup.exe
            ${{ runner.temp }}/gleamdesk-packages/SHA256SUMS.txt
            ${{ runner.temp }}/gleamdesk-packages/BUILD-METADATA.json
          if-no-files-found: error
          retention-days: 7
      - name: Summarize
        run: |
          "## Unsigned Windows x64 packages" >> $env:GITHUB_STEP_SUMMARY
          "Commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "Portable ZIP, NSIS installer, SHA-256 checksums and build metadata are in this run's artifact." >> $env:GITHUB_STEP_SUMMARY
          "This workflow does not publish a Release or verify native desktop interaction." >> $env:GITHUB_STEP_SUMMARY
