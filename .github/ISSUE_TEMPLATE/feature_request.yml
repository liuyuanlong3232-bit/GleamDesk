name: Feature request / 功能建议
description: Explain the problem and a focused proposed improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem / 想解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 建议的效果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 其他办法
